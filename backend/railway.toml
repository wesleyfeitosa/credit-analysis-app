# Railway build/deploy configuration for the backend service.
#
# Deploys happen via `railway up` from the REPO ROOT (see
# .github/workflows/deploy.yml). The whole repo is uploaded and the service's
# Root Directory = /backend selects this folder as the build context, so
# `dockerfilePath = "Dockerfile"` resolves to backend/Dockerfile.
#
# NOTE: Railway does NOT auto-discover a config file inside the Root Directory.
# For this file to take effect (the healthcheck below), set the service's
# "Railway Config File" path to /backend/railway.toml. Without that, the build
# still works via Root Directory + Dockerfile auto-detection — you just don't
# get the healthcheck/restart policy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The API exposes GET /health (returns 200 {"status":"ok"}). Railway waits for
# it to pass before routing traffic to a new deploy.
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
