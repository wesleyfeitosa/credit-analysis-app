name: credit-analysis

services:
  db:
    image: postgres:16
    container_name: credit-analysis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pwd123
      POSTGRES_DB: CreditAnalysisGolangApp
    ports:
      # Exposed for local DB tools; the backend talks to it over the internal
      # network at db:5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # First boot only (empty data volume): schema migrations run in order,
      # then the seed (mounted as zz_seed.sql so it sorts last). This is a local
      # dev convenience — production does NOT seed: the deploy runs
      # `go run ./cmd/migrate` against ./backend/migrations (schema) only.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
      - ./backend/seeds/0001_seed.sql:/docker-entrypoint-initdb.d/zz_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CreditAnalysisGolangApp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: credit-analysis-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Host "db" resolves to the postgres service on the compose network.
      DATABASE_URL: "postgres://postgres:pwd123@db:5432/CreditAnalysisGolangApp?sslmode=disable"
      JWT_SECRET: "dslkaj4312397f0sd98231ijrel3k4j2c09as8xd09981234e21"
    ports:
      - "8080:8080"
    depends_on:
      # Wait until postgres accepts connections — the backend pings the DB at
      # startup and exits if it is unreachable.
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: credit-analysis-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
